<text x="40.0" y="376.0" text-anchor="start" font-size="18" font-weight="400" fill="#475569">T: CON, NON, ACK or RST · Code c.dd: 0.01 GET, 0.03 PUT, 2.04 Changed, 2.05 Content, 4.04 Not Found</text>
