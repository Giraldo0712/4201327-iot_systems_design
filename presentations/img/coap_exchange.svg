<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 510" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<defs><marker id="ar-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker><marker id="ar-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><marker id="ar-c1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/></marker><marker id="ar-c2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="ar-c3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="ar-c4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="ar-c5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e11d48"/></marker><marker id="ar-c6" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="ar-c7" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="ar-c8" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/></marker></defs>
<text x="240.0" y="30.0" text-anchor="middle" font-size="24" font-weight="700" fill="#475569">HTTP over TCP (Lab 0)</text>
<text x="50.0" y="62.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">client</text>
<text x="430.0" y="62.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">server</text>
<line x1="50.0" y1="74.0" x2="50.0" y2="490.0" stroke="#cbd5e1" stroke-width="3"/>
<line x1="430.0" y1="74.0" x2="430.0" y2="490.0" stroke="#cbd5e1" stroke-width="3"/>
<line x1="50.0" y1="106.0" x2="422.0" y2="120.0" stroke="#475569" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="240.0" y="98.0" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">SYN</text>
<line x1="430.0" y1="156.0" x2="58.0" y2="170.0" stroke="#475569" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="240.0" y="148.0" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">SYN-ACK</text>
<line x1="50.0" y1="206.0" x2="422.0" y2="220.0" stroke="#475569" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="240.0" y="198.0" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">ACK</text>
<line x1="50.0" y1="256.0" x2="422.0" y2="270.0" stroke="#475569" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="240.0" y="248.0" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">GET /api/sensor + headers, ~150 B</text>
<line x1="430.0" y1="306.0" x2="58.0" y2="320.0" stroke="#475569" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="240.0" y="298.0" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">200 OK + headers, ~120 B</text>
<line x1="50.0" y1="356.0" x2="422.0" y2="370.0" stroke="#475569" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="240.0" y="348.0" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">FIN</text>
<line x1="430.0" y1="406.0" x2="58.0" y2="420.0" stroke="#475569" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="240.0" y="398.0" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">ACK, FIN</text>
<line x1="50.0" y1="456.0" x2="422.0" y2="470.0" stroke="#475569" stroke-width="2" marker-end="url(#ar-gray)"/>
<text x="240.0" y="448.0" text-anchor="middle" font-size="20" font-weight="400" fill="#475569">ACK</text>
<text x="790.0" y="30.0" text-anchor="middle" font-size="24" font-weight="700" fill="#16a34a">CoAP over UDP (Lab 3)</text>
<text x="600.0" y="62.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">client</text>
<text x="980.0" y="62.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">server</text>
<line x1="600.0" y1="74.0" x2="600.0" y2="190.0" stroke="#cbd5e1" stroke-width="3"/>
<line x1="980.0" y1="74.0" x2="980.0" y2="190.0" stroke="#cbd5e1" stroke-width="3"/>
<line x1="600.0" y1="106.0" x2="972.0" y2="120.0" stroke="#16a34a" stroke-width="2" marker-end="url(#ar-c3)"/>
<text x="790.0" y="98.0" text-anchor="middle" font-size="20" font-weight="700" fill="#16a34a">CON GET /env/temp</text>
<line x1="980.0" y1="156.0" x2="608.0" y2="170.0" stroke="#16a34a" stroke-width="2" marker-end="url(#ar-c3)"/>
<text x="790.0" y="148.0" text-anchor="middle" font-size="20" font-weight="700" fill="#16a34a">ACK 2.05 + 6 B of CBOR</text>
<text x="790.0" y="250.0" text-anchor="middle" font-size="21" font-weight="700" fill="#16a34a">one datagram each way:</text>
<text x="790.0" y="280.0" text-anchor="middle" font-size="21" font-weight="400" fill="#0f172a">no handshake, no teardown</text>
</svg>
