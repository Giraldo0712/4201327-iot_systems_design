<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 476" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<defs><marker id="ar-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker><marker id="ar-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><marker id="ar-c1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/></marker><marker id="ar-c2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="ar-c3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="ar-c4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="ar-c5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e11d48"/></marker><marker id="ar-c6" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="ar-c7" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="ar-c8" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/></marker></defs>
<text x="40.0" y="30.0" text-anchor="start" font-size="24" font-weight="700" fill="#0f172a">Uncompressed IPv6 header: 40 bytes</text>
<rect x="40.0" y="46.0" width="100.0" height="64.0" rx="4" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<text x="90.0" y="84.0" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">4 B</text>
<rect x="140.0" y="46.0" width="50.0" height="64.0" rx="4" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<text x="165.0" y="84.0" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">2 B</text>
<rect x="190.0" y="46.0" width="25.0" height="64.0" rx="4" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<rect x="215.0" y="46.0" width="25.0" height="64.0" rx="4" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<rect x="240.0" y="46.0" width="400.0" height="64.0" rx="4" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<text x="440.0" y="76.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">source address</text>
<text x="440.0" y="100.0" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">16 B</text>
<rect x="640.0" y="46.0" width="400.0" height="64.0" rx="4" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<text x="840.0" y="76.0" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">destination address</text>
<text x="840.0" y="100.0" text-anchor="middle" font-size="17" font-weight="400" fill="#475569">16 B</text>
<text x="40.0" y="148.0" text-anchor="start" font-size="21" font-weight="400" fill="#475569">what the receiver can rebuild instead:</text>
<text x="60.0" y="180.0" text-anchor="start" font-size="21" font-weight="700" fill="#0f172a">ver · class · flow:</text>
<text x="320.0" y="180.0" text-anchor="start" font-size="21" font-weight="400" fill="#0f172a">always 6 · usually 0 · usually 0</text>
<text x="60.0" y="214.0" text-anchor="start" font-size="21" font-weight="700" fill="#0f172a">length:</text>
<text x="320.0" y="214.0" text-anchor="start" font-size="21" font-weight="400" fill="#0f172a">from the frame length</text>
<text x="60.0" y="248.0" text-anchor="start" font-size="21" font-weight="700" fill="#0f172a">next:</text>
<text x="320.0" y="248.0" text-anchor="start" font-size="21" font-weight="400" fill="#0f172a">UDP: one flag bit</text>
<text x="60.0" y="282.0" text-anchor="start" font-size="21" font-weight="700" fill="#0f172a">hops:</text>
<text x="320.0" y="282.0" text-anchor="start" font-size="21" font-weight="400" fill="#0f172a">1, 64 or 255: 2 bits</text>
<text x="60.0" y="316.0" text-anchor="start" font-size="21" font-weight="700" fill="#0f172a">source address:</text>
<text x="320.0" y="316.0" text-anchor="start" font-size="21" font-weight="400" fill="#0f172a">prefix from context; IID from the MAC header</text>
<text x="60.0" y="350.0" text-anchor="start" font-size="21" font-weight="700" fill="#0f172a">destination address:</text>
<text x="320.0" y="350.0" text-anchor="start" font-size="21" font-weight="400" fill="#0f172a">prefix from context; IID from the MAC header</text>
<rect x="40.0" y="388.0" width="50.0" height="64.0" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
<text x="110.0" y="428.0" text-anchor="start" font-size="24" font-weight="700" fill="#0d9488">IPHC (RFC 6282): as little as 2 bytes</text>
<text x="110.0" y="456.0" text-anchor="start" font-size="19" font-weight="400" fill="#475569">an interface ID the receiver can't rebuild still travels: 8 B per address</text>
</svg>
