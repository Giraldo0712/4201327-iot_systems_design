<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 290" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<defs><marker id="ar-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/></marker><marker id="ar-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker><marker id="ar-c1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/></marker><marker id="ar-c2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker><marker id="ar-c3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/></marker><marker id="ar-c4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0d9488"/></marker><marker id="ar-c5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#e11d48"/></marker><marker id="ar-c6" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/></marker><marker id="ar-c7" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/></marker><marker id="ar-c8" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#db2777"/></marker></defs>
<text x="40.0" y="30.0" text-anchor="start" font-size="24" font-weight="700" fill="#0f172a">One 802.15.4 frame: 127 bytes</text>
<rect x="40.0" y="50.0" width="70.9" height="70.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="75.4" y="82.0" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">MHR</text>
<text x="75.4" y="108.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">~9 B</text>
<rect x="110.9" y="50.0" width="110.2" height="70.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="166.0" y="82.0" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">security</text>
<text x="166.0" y="108.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">0–14 B</text>
<rect x="221.1" y="50.0" width="803.1" height="70.0" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="622.7" y="82.0" text-anchor="middle" font-size="20" font-weight="700" fill="#0d9488">payload: everything above the MAC</text>
<text x="622.7" y="108.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">≤ 102 B</text>
<rect x="1024.3" y="50.0" width="15.7" height="70.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="1032.1" y="145.0" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">2 B</text>
<line x1="221.1" y1="160.0" x2="536.1" y2="160.0" stroke="#e11d48" stroke-width="4"/>
<text x="221.1" y="192.0" text-anchor="start" font-size="20" font-weight="700" fill="#e11d48">an uncompressed IPv6 header alone: 40 B</text>
<text x="221.1" y="222.0" text-anchor="start" font-size="20" font-weight="400" fill="#0f172a">then UDP (8 B), CoAP, and your data</text>
<text x="40.0" y="270.0" text-anchor="start" font-size="19" font-weight="400" fill="#475569">Wi-Fi carries up to 1500 B of IP packet per frame: Lab 0 never counted header bytes.</text>
</svg>
