# Course config for the course kit (../course-kit/STANDARD.md).
# Check: python3 ../course-kit/tools/coursekit.py lint

[course]
code = "4201327"
name = "IoT Systems Design"
language = "en"
accent = "#1d4ed8"

[types]
lab = ["labs/lab[0-9].md", "labs/lab0_*.md"]
talk = ["presentations/*.md"]
script = ["lectures/lab[0-9]_lecture.md"]
sop = ["labs/sops/sop[0-9][0-9]_*.md"]

[talk]
minutes = 40

# One color per recurring entity, for every figure and slide (theme/course.css: c1..c8).
# Mermaid: fill with the tint, stroke with the color.
[palette]
UD = "c1"
PED = "c2"
ASD = "c3"
OMD = "c6"
SCD = "c7"
RAID = "c8"
Trustworthiness = "c5"
# 802.15.4, Thread and the mesh; other radios and protocols are drawn in gray.
Thread = "c4"

# Session number = "date · toolchain · hardware" of the last full run.
[validated]
