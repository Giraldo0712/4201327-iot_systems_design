<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 150 1280 390" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
  <defs>
    <linearGradient id="main" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="1230" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Classic main line -->
  <line x1="60" y1="300" x2="1230" y2="300" stroke="url(#main)" stroke-width="12" stroke-linecap="round"/>
  <text x="1230" y="350" text-anchor="end" font-size="20" font-weight="700" fill="#1d4ed8">Bluetooth Classic (BR/EDR)</text>

  <!-- LE branch at 2010 -->
  <path d="M894 300 C 894 420, 930 450, 1010 450 L 1230 450" fill="none" stroke="#9333ea" stroke-width="10" stroke-linecap="round"/>
  <text x="1230" y="490" text-anchor="end" font-size="20" font-weight="700" fill="#9333ea">4.0 · 2010: Bluetooth Low Energy</text>
  <text x="1230" y="518" text-anchor="end" font-size="17" fill="#6b21a8">a second, separate radio protocol</text>

  <!-- milestones: above -->
  <g font-size="19" text-anchor="middle">
    <line x1="80" y1="300" x2="80" y2="232" stroke="#64748b" stroke-width="2"/>
    <circle cx="80" cy="300" r="15" fill="#f97316" stroke="#fff" stroke-width="4"/>
    <text x="90" y="190" font-weight="700" fill="#c2410c">1994</text>
    <text x="90" y="216" font-size="16" fill="#334155">Ericsson starts</text>

    <line x1="334" y1="300" x2="334" y2="232" stroke="#64748b" stroke-width="2"/>
    <circle cx="334" cy="300" r="15" fill="#e11d48" stroke="#fff" stroke-width="4"/>
    <text x="334" y="190" font-weight="700" fill="#be123c">1.0 · 1999</text>
    <text x="334" y="216" font-size="16" fill="#334155">first spec</text>

    <line x1="589" y1="300" x2="589" y2="232" stroke="#64748b" stroke-width="2"/>
    <circle cx="589" cy="300" r="15" fill="#16a34a" stroke="#fff" stroke-width="4"/>
    <text x="589" y="190" font-weight="700" fill="#15803d">2.0 · 2004</text>
    <text x="589" y="216" font-size="16" fill="#334155">EDR: 2–3 Mbps</text>

    <line x1="844" y1="300" x2="844" y2="232" stroke="#64748b" stroke-width="2"/>
    <circle cx="844" cy="300" r="15" fill="#94a3b8" stroke="#fff" stroke-width="4"/>
    <text x="844" y="190" font-weight="700" fill="#475569">3.0 · 2009</text>
    <text x="844" y="216" font-size="16" fill="#334155">HS over Wi-Fi (abandoned)</text>

    <line x1="1047" y1="300" x2="1047" y2="232" stroke="#64748b" stroke-width="2"/>
    <circle cx="1047" cy="300" r="15" fill="#0d9488" stroke="#fff" stroke-width="4"/>
    <text x="1047" y="190" font-weight="700" fill="#0f766e">4.1 · 2013</text>
    <text x="1047" y="216" font-size="16" fill="#334155">Secure Connections</text>
  </g>

  <!-- milestones: below -->
  <g font-size="19" text-anchor="middle">
    <line x1="284" y1="300" x2="284" y2="372" stroke="#64748b" stroke-width="2"/>
    <circle cx="284" cy="300" r="15" fill="#f59e0b" stroke="#fff" stroke-width="4"/>
    <text x="284" y="402" font-weight="700" fill="#b45309">1998</text>
    <text x="284" y="428" font-size="16" fill="#334155">Bluetooth SIG formed</text>

    <line x1="538" y1="300" x2="538" y2="372" stroke="#64748b" stroke-width="2"/>
    <circle cx="538" cy="300" r="15" fill="#0ea5e9" stroke="#fff" stroke-width="4"/>
    <text x="538" y="402" font-weight="700" fill="#0369a1">1.2 · 2003</text>
    <text x="538" y="428" font-size="16" fill="#334155">adaptive hopping</text>

    <line x1="742" y1="300" x2="742" y2="372" stroke="#64748b" stroke-width="2"/>
    <circle cx="742" cy="300" r="15" fill="#db2777" stroke="#fff" stroke-width="4"/>
    <text x="742" y="402" font-weight="700" fill="#be185d">2.1 · 2007</text>
    <text x="742" y="428" font-size="16" fill="#334155">Secure Simple Pairing</text>

    <circle cx="894" cy="300" r="17" fill="#9333ea" stroke="#fff" stroke-width="4"/>
  </g>
</svg>
