# Based on $ZEPHYR_BASE/samples/net/openthread/coprocessor (prj.conf +
# overlay-rcp.conf).

CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_COPROCESSOR=y
CONFIG_OPENTHREAD_COPROCESSOR_RCP=y
# Must match the host. From 1.2 on, the RCP reports the software TX security
# and TX timing the host requires; the 1.1 default makes the host abort.
CONFIG_OPENTHREAD_THREAD_VERSION_1_4=y
# The 0 dBm default barely reaches past a few centimetres on these boards.
CONFIG_OPENTHREAD_DEFAULT_TX_POWER=20

CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8

# Logs travel to the host inside Spinel frames
CONFIG_LOG=y
CONFIG_LOG_MAX_LEVEL=1
CONFIG_LOG_BACKEND_SPINEL=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_BOOT_BANNER=n

CONFIG_NVS=y
CONFIG_MAIN_STACK_SIZE=2560
CONFIG_INIT_STACKS=y
