CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_CBPRINTF_FP_SUPPORT=y

# Networking over 802.15.4 (Interface Capability)
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_NET_UDP=y
# Without this every board in the room auto-joins the same default network on
# channel 11 at boot.
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_PING_SENDER=y
# Lab 5: build a global address from the prefix a Border Router advertises.
CONFIG_OPENTHREAD_SLAAC=y
# The 0 dBm default barely reaches past a few centimetres on these boards.
CONFIG_OPENTHREAD_DEFAULT_TX_POWER=20

# Settings backend for the Thread dataset
CONFIG_NVS=y

# OpenThread CLI as "ot <command>", including the "ot coap" client
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_OPENTHREAD_COAP=y
CONFIG_OPENTHREAD_COAP_OBSERVE=y
# "ot dataset set active <hex>" is ~240 characters; the defaults truncate a paste.
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512
CONFIG_OPENTHREAD_MAC_FILTER=y

# CoAP server: /env/temp and /act/valve, over DTLS on UDP 5684 (CoAPS)
CONFIG_COAP=y
CONFIG_COAP_SERVER=y
CONFIG_COAP_SERVICE_OBSERVERS=4

# CBOR payloads; canonical = definite-length maps (A1, not BF ... FF)
CONFIG_ZCBOR=y
CONFIG_ZCBOR_CANONICAL=y

# Sensor drivers; the overlay in sensors/ picks the one that is built
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_W1=y

# RGB LED: Thread role, or white while the valve is open
CONFIG_LED_STRIP=y

# DTLS 1.2 with a pre-shared key, TLS_PSK_WITH_AES_128_CCM_8. OpenThread's
# default security profile locks the Mbed TLS options, so the custom profile
# repeats what OpenThread needs and adds DTLS and PSK.
CONFIG_OPENTHREAD_SECURITY_CUSTOM_CONFIG=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_MD_C=y
CONFIG_MBEDTLS_ASN1_PARSE_C=y
CONFIG_SECURE_STORAGE=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_CMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_SSL_PROTO_DTLS=y
CONFIG_MBEDTLS_KEY_EXCHANGE_PSK_ENABLED=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_PSA_WANT_ALG_TLS12_PSK_TO_MS=y
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=1024
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=1024
CONFIG_MBEDTLS_HEAP_SIZE=32768

CONFIG_TLS_CREDENTIALS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_ENABLE_DTLS=y
# Two DTLS sockets: the server and the "coaps" shell client. The server keeps
# a session per client (the shell on another board, a laptop, a bridge).
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_NET_SOCKETS_TLS_MAX_SESSION_CONTEXTS=4
# A session survives 2 min of client silence: longer than the 45 s Observe
# heartbeat, whose ACK keeps an observer's session alive.
CONFIG_NET_SOCKETS_DTLS_TIMEOUT=120000

# The "coaps" shell client runs the DTLS handshake on the shell thread
CONFIG_SHELL_STACK_SIZE=8192

# Lab 8, the Golden Master: a stalled loop resets the node (task watchdog, with
# the hardware watchdog as fallback), and stack canaries catch overflows.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_STACK_CANARIES=y
