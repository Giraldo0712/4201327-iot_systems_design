CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_CBPRINTF_FP_SUPPORT=y

# Networking over 802.15.4 (Interface Capability)
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_NET_UDP=y
# Without this every board in the room auto-joins the same default network on
# channel 11 at boot.
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_PING_SENDER=y

# Settings backend for the Thread dataset
CONFIG_NVS=y

# OpenThread CLI as "ot <command>", including the "ot coap" client
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_OPENTHREAD_COAP=y
CONFIG_OPENTHREAD_COAP_OBSERVE=y
# "ot dataset set active <hex>" is ~240 characters; the defaults truncate a paste.
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512
CONFIG_OPENTHREAD_MAC_FILTER=y

# CoAP server: /env/temp and /act/valve on UDP 5683
CONFIG_COAP=y
CONFIG_COAP_SERVER=y
CONFIG_COAP_SERVICE_OBSERVERS=4

# CBOR payloads; canonical = definite-length maps (A1, not BF ... FF)
CONFIG_ZCBOR=y
CONFIG_ZCBOR_CANONICAL=y

# RGB LED: Thread role, or white while the valve is open
CONFIG_LED_STRIP=y
