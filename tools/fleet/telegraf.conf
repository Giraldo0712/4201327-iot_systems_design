# Every message on soilsense/<node>/<measurement> becomes an InfluxDB point:
# measurement "env" or "health", tag "node", one field per JSON key.
[agent]
  interval = "10s"
  flush_interval = "1s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["soilsense/+/env", "soilsense/+/health"]
  topic_tag = ""
  data_format = "json"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "soilsense/+/+"
    measurement = "_/_/measurement"
    tags = "_/node/_"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "greenfield"
  bucket = "soilsense"
